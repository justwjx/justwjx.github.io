<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open in Obsidian</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 720px; margin: 48px auto; padding: 0 20px; line-height: 1.6; }
    code { background: #f5f5f5; padding: 2px 5px; border-radius: 4px; word-break: break-all; }
    .muted { color: #666; }
    a.button { display: inline-block; margin: 16px 0; padding: 10px 14px; border-radius: 8px; background: #4f46e5; color: white; text-decoration: none; }
  </style>
</head>
<body>
  <h1>Open in Obsidian</h1>
  <p id="status">Preparing Obsidian link…</p>
  <p><a id="open" class="button" href="#">Open in Obsidian</a></p>
  <p class="muted">If nothing happens, click the button above. This page expects <code>?v=&lt;vault&gt;&amp;f=&lt;vault-relative-file&gt;</code>.</p>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const vault = params.get('v') || 'Albert Vault';
      const file = params.get('f');
      const status = document.getElementById('status');
      const open = document.getElementById('open');

      if (!file) {
        status.textContent = 'Missing required query parameter: f';
        open.style.display = 'none';
        return;
      }

      const target = 'obsidian://open?vault=' + encodeURIComponent(vault) + '&file=' + encodeURIComponent(file);
      open.href = target;
      status.innerHTML = 'Opening <code>' + file.replace(/[&<>"']/g, function (c) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      }) + '</code> in vault <code>' + vault.replace(/[&<>"']/g, function (c) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      }) + '</code>…';

      setTimeout(function () {
        window.location.href = target;
      }, 200);
    }());
  </script>
</body>
</html>
